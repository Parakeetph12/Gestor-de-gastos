<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Lançar despesa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Lançar despesa</h1>
    <p><a href="index.html">Voltar à página inicial</a></p>

    <form method="post" action="despesa.php" data-destino="despesa.php" novalidate>
        <tpi2>
            <p><label>Descrição: <input type="text" name="descricao"></label></p>
            <p><label>Valor total (R$): <input type="number" step="0.01" name="valor"></label></p>
            <p><label>Data: <input type="date" name="data"></label></p>
            <p><label>Categoria:
                <select name="categoria">
                    <option value="">Selecione</option>
                    <option value="Alimentação">Alimentação</option>
                    <option value="Transporte">Transporte</option>
                    <option value="Moradia">Moradia</option>
                    <option value="Saúde">Saúde</option>
                    <option value="Educação">Educação</option>
                    <option value="Lazer">Lazer</option>
                </select>
            </label></p>
            <p><label>Forma de pagamento:
                <select name="forma_pagamento">
                    <option value="">Selecione</option>
                    <option value="Dinheiro">Dinheiro</option>
                    <option value="Débito">Débito</option>
                    <option value="Crédito">Crédito</option>
                    <option value="Pix">Pix</option>
                </select>
            </label></p>
            <p><label>Parcelas: <input type="number" name="parcelas" value="1"></label></p>
            <p><button type="submit">Lançar despesa</button></p>
        </tpi2>
    </form>

    <div id="resposta"></div>
    <script src="script.js"></script>
</body>
</html>
